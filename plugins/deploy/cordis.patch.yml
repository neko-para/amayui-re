# plugins/deploy 的 bundle patch —— 本插件作为 profile 的**一个 patch 层**被组合进来。
#
# 形态与其他 bundle 一致（见 `@deepseek-ai/dsh-base` 的 `cordis.patch.yml`）：
# 一次 `insert`，一条 loader entry；`name` 是**包名**，DSH 按它 import 本包的主入口（`index.mjs`）。
#
# ★ 部署方（人）要改的是**这一层的 config**（允许写哪些根、审计落哪），改法是在 profile 的
#   `cordis.patch.yml` 里按 id 覆盖（last write wins）：
#
#     - id: amayui-deploy
#       name: '@amayui/dsh-plugin-deploy'
#       config:
#         allowedRoots: ['dist', 'E:\Projects']
#
- insert:
    - id: amayui-deploy
      name: '@amayui/dsh-plugin-deploy'
