# pnpm 的 workspace 真源（package.json 的 "workspaces" 字段保留，供不认 yaml 的工具读）
# ★ `apps/emulator` 与 `apps/inspector` 仍只有"重写计划"占位，代码还没搬进来，等 M4/M7 落地时再入（见 docs/00-origin/decisions.md）。
# ★ `apps/workbench` 是**真项目**（有自己的依赖与构建），所以它入列表 —— 判据不是"在不在 apps/"，而是"有没有自己的工具链"。
packages:
  - packages/*
  - tools
  - apps/workbench

# ★ 项目级设置写在**这里**，不写 `.npmrc`：
#   官方口径（https://pnpm.io/settings）：`.npmrc` 只读 auth 与 registry；**定义 `node_modules` 结构的设置
#   （`nodeLinker` / `shamefullyHoist` 等）只能写在 `pnpm-workspace.yaml`**。
#   pnpm 10 还认 `.npmrc` 里的老写法，pnpm 11 起会忽略 ⇒ 写在这里才**不会随大版本升级静默失效**。
#   `nodeLinker: hoisted` 的用途见 AGENTS.md §3：默认 `isolated` 用 junction 链到 `.pnpm/…`，
#   而本机 `fs.realpathSync` 不解析 junction ⇒ `vite` 的 `import 'rolldown'` 会炸。
#   ★ 机器级设置（如 store 位置）**不放这里**：用全局 `pnpm config set store-dir <路径>`。
nodeLinker: hoisted
shamefullyHoist: true
