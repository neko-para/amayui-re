# pnpm 的 workspace 真源（package.json 的 "workspaces" 字段保留，供不认 yaml 的工具读）
# ★ 入列表的判据不是"在不在 apps/"，而是**有没有自己的依赖**：
#   `apps/emulator` 现在有 `@amayui/age-format` 依赖（它的模型要用编解码与格式层）⇒ **入列表**。
#   理由不只是"能装依赖"：**只有声明了依赖，pnpm 才建 `node_modules/@amayui/*` 链接**，
#   包名导入才解析得到（否则只能写 `../../../../packages/...` 这种绑死目录层级的相对路径）。
# ★ `apps/inspector` 仍只有"重写计划"占位（无代码、无依赖），等 M7 落地时再入。
packages:
  - packages/*
  - tools
  - apps/emulator
  - apps/workbench
  # ★ `plugins/*` 入列表的判据与 `apps/workbench` 相同：**它有自己的依赖**
  #   （`@deepseek-ai/dsh-tools` / `schemastery` 是普通 dependencies ⇒ 由本仓 `pnpm install` 装，
  #   落在工作区内的 `.pnpm-store` ⇒ 装依赖这一步**不需要提权**）。
  #   ★ 版本要与**正在运行的 DSH** 同步（当前 `0.2.0-rc.2`）：升 DSH 时同步升插件里那两行 ——
  #   否则插件会解析到另一份 `defineTool`（见 `plugins/deploy/README.md` §5）。
  - plugins/*

# ★ 项目级设置写在**这里**，不写 `.npmrc`：
#   官方口径（https://pnpm.io/settings）：`.npmrc` 只读 auth 与 registry；**定义 `node_modules` 结构的设置
#   （`nodeLinker` / `shamefullyHoist` 等）只能写在 `pnpm-workspace.yaml`**。
#   pnpm 10 还认 `.npmrc` 里的老写法，pnpm 11 起会忽略 ⇒ 写在这里才**不会随大版本升级静默失效**。
#
# ★ `storeDir` 用**相对路径**（相对本文件所在目录 = workspace 根）：
#   这样它是可移植的（换机器/换盘符都不用改），并且**落在工作区内**——
#   受限沙箱只允许写工作区，store 在工作区内 ⇒ `pnpm install` **不需要提权**。
#   ⚠ 这条与"README 不写状态"无关：它是**配置**不是状态，且随仓库入库、每台机器都一样地解析。
#   ⚠ `.npmrc` 不做变量展开、写进去只能是绝对路径 ⇒ store 设置**不要**放 `.npmrc`。
storeDir: '.pnpm-store'
#
# ★ **只放 `storeDir`**（用户口径 2026-10）：本仓**不**显式设 `nodeLinker`，用 pnpm 默认的 `isolated`。
#   为什么不当"扁平"来配（实测对照，副本里跑的，见下表）：
#
#   | 配置 | 根 node_modules | tools/node_modules | .modules.yaml |
#   |---|---|---|---|
#   | **只有 storeDir（采用）** | **0 个** | 1 个 junction（jimp） | `nodeLinker: "isolated"` |
#   | 加 `nodeLinker: hoisted` | **91 个实体目录** | **不存在** | `nodeLinker: "hoisted"` |
#
#   两者**都能正常解析依赖**（`tools` 解析 `jimp` 均 OK）⇒ `hoisted` **不是必须的**。
#   ⚠ 本文件与 `AGENTS.md` 曾写过的病因 —— ~~"`fs.realpathSync` 不解析 junction ⇒ `vite` 的
#   `import 'rolldown'` 会 `ERR_MODULE_NOT_FOUND`"~~ —— **已被直接实验推翻**：
#   在 `.tmp` 复刻 isolated 布局后从 junction 路径 `import` 是**成功**的（Node 的 ESM 解析走真实路径）。
#   所以那一行没有存在理由；`hoisted` 反而把依赖全摊到根上，遮蔽风险更大。
#
#   ★ 也**不写 `shamefullyHoist`**：它的默认值就是 `true`，写出来是冗余；
#   实测两种形态下 `.modules.yaml` 记的都是 `publicHoistPattern: []` ⇒ 那行不生效。
#
#   ★ 注意本仓 `node_modules` 的**现状可能与配置不一致**：它的实际形状由**上一次安装时的配置**决定
#   （pnpm 见 `.modules.yaml` 与配置一致就跳过重链）。判据：`node_modules/.modules.yaml` 里的
#   `nodeLinker` 值 = 你期望的布局。
